<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple word and character counter.">
  <title>Word Counter</title>
  <link rel="stylesheet" href="CSS/style.css">
  <script src="JS/script.js" defer></script>
</head>
<body>
  <main class="counter">
    <h1>Word Counter</h1>
    <p class="subtitle">Write something and see the count as you type.</p>

    <label for="text-input">Your text</label>
    <textarea id="text-input" rows="8" placeholder="Start typing here..." spellcheck="true"></textarea>

    <div class="results" aria-live="polite">
      <div class="stat">
        <strong id="word-count">0</strong>
        <span>Words</span>
      </div>
      <div class="stat">
        <strong id="character-count">0</strong>
        <span>Characters</span>
      </div>
      <div class="stat">
        <strong id="character-no-space-count">0</strong>
        <span>No spaces</span>
      </div>
    </div>

    <button type="button" id="clear-button">Clear text</button>
  </main>
</body>
</html>
